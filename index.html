<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2G's BarberStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{
 margin:0;
 font-family:'Poppins',sans-serif;
 background:#111;
 color:#fff;
 cursor:auto;
}

.card, button, a {
 cursor: url('barber-pole.png'), pointer;
}

#loader{
 position:fixed;
 width:100%;
 height:100%;
 background:#000;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:9999;
}

.pole{
 width:70px;
 height:220px;
 border-radius:40px;
 background:repeating-linear-gradient(45deg, red 0, red 20px, white 20px, white 40px, blue 40px, blue 60px);
 animation:spin 1s linear infinite, rotate3d 2s linear infinite;
 transform-style:preserve-3d;
}

@keyframes spin{
 from{background-position:0 0;}
 to{background-position:0 120px;}
}
@keyframes rotate3d{
 from{transform:rotateY(0deg);}
 to{transform:rotateY(360deg);}
}

.fade{
 opacity:0;
 transform:translateY(40px);
 transition:all 0.8s ease;
}
.fade.show{
 opacity:1;
 transform:translateY(0);
}

#main{
 clip-path: inset(0 100% 0 0);
 transition: clip-path 1.2s ease;
}
#main.reveal{
 clip-path: inset(0 0 0 0);
}

header{
 display:flex;
 justify-content:center;
 padding:20px;
 background:#000;
}
header img{height:80px}

.hero{
 height:90vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url('logo-bg.png') center/cover no-repeat;
}
.hero h1{font-size:50px}
.hero p{color:#ccc}

.section{padding:50px 20px;text-align:center}

.barbers{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:25px;
}

.card{
 background:#1a1a1a;
 border-radius:12px;
 overflow:hidden;
 cursor:pointer;
 transition:.3s;
}
.card:hover{transform:scale(1.05)}

.card img{
 width:100%;
 height:250px;
 object-fit:cover;
}

.profile{
 display:none;
 text-align:center;
 padding:60px 20px;
}

.profile img{
 width:250px;
 border-radius:12px;
}

.socials a{
 display:block;
 margin:8px 0;
 color:#fff;
 text-decoration:none;
}
</style>
</head>
<body>

<div id="loader"><div class="pole"></div></div>

<header>
<img src="logo.jpg">
</header>

<div id="main">
<section class="hero fade">
<h1>2G's BarberStudio</h1>
<p>Taper Fades • Clean Fades • Scissor Works • Curls • Braids • Line Ups • Beard</p>
</section>

<section class="section fade">
<h2>Our Barbers</h2>
<div class="barbers">
<div class="card" onclick="openProfile('sen')">
<img src="placeholder.jpg"><h3>SEN CUTZ</h3></div>

<div class="card" onclick="openProfile('radz')">
<img src="radz.jpg"><h3>RADZ WORK</h3></div>

<div class="card" onclick="openProfile('gin')">
<img src="gin.jpg"><h3>GINWITDACLIPS</h3></div>
</div>
</section>
</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// SMART LOADER
window.addEventListener("load",()=>{
 let l = document.getElementById("loader");

 if(localStorage.getItem("visited")){
   l.style.display = "none";
   document.getElementById("main").classList.add("reveal");
 } else {
   setTimeout(()=>{
     l.style.opacity="0";
     setTimeout(()=>l.style.display="none",500);
   },1500);

   setTimeout(()=>{
     document.getElementById("main").classList.add("reveal");
   },1600);

   localStorage.setItem("visited", "true");
 }
});

// MUSIC FIX
const music = document.getElementById("bgMusic");
let started = false;

window.addEventListener("load", () => {
  music.volume = 0.5;
  music.play().catch(() => {});
});

function unlockAudio() {
  if (!started) {
    music.play().then(() => {
      started = true;
    }).catch(()=>{});
  }
}

["click","touchstart","scroll"].forEach(event => {
  document.addEventListener(event, unlockAudio, { once: true });
});

// Fade scroll
const observer = new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
   if(entry.isIntersecting){
     entry.target.classList.add("show");
   }
 });
});
document.querySelectorAll(".fade").forEach(el=>observer.observe(el));
</script>

</body>
</html>
