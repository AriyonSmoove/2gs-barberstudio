<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2G's BarberStudio</title>

  <!-- PROFESSIONAL FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000;
      position: relative;
      z-index: 2;
    }

    header img {
      height: 80px;
    }

    /* HERO WITH LOGO BACKGROUND */
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      /* YOUR LOGO BACKGROUND (UPLOAD TO GITHUB AS logo-bg.png) */
      background: 
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url('logo-bg.png') center/contain no-repeat;

      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 50px;
      font-weight: 700;
    }

    .hero p {
      font-size: 16px;
      color: #ccc;
      margin-top: 10px;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .barbers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card h3 {
      padding: 15px;
    }

    .profile {
      display: none;
      padding: 60px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .profile img {
      width: 250px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 20px;
      background: #c0392b;
      border: none;
      color: #fff;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <img src="logo.jpg" alt="2G Logo">
</header>

<div id="main">

<section class="hero">
  <h1>2G's BarberStudio</h1>

  <!-- UPDATED SERVICE LINE -->
  <p>
    Taper Fades • Clean Fades • Scissor Works • Curls • Braids • Line Ups • Beard
  </p>
</section>

<section class="section">
  <h2>Our Barbers</h2>

  <div class="barbers">

    <div class="card" onclick="openProfile('sen')">
      <img src="placeholder.jpg">
      <h3>SEN CUTZ</h3>
    </div>

    <div class="card" onclick="openProfile('radz')">
      <img src="radz.jpg">
      <h3>RADZ WORK</h3>
    </div>

    <div class="card" onclick="openProfile('gin')">
      <img src="gin.jpg">
      <h3>GINWITDACLIPS</h3>
    </div>

  </div>
</section>

</div>

<!-- PROFILES -->

<div id="sen" class="profile">
  <h1>SEN CUTZ</h1>
  <img src="placeholder.jpg">
  <p>Price Range: ₱150 - ₱1500</p>
  <button class="btn" onclick="showMain()">Back</button>
</div>

<div id="radz" class="profile">
  <h1>RADZ WORK</h1>
  <img src="radz.jpg">
  <p>Price Range: ₱250 - ₱3500</p>
  <button class="btn" onclick="showMain()">Back</button>
</div>

<div id="gin" class="profile">
  <h1>GINWITDACLIPS</h1>
  <img src="gin.jpg">
  <p>Price: ₱150</p>
  <button class="btn" onclick="showMain()">Back</button>
</div>

<footer>
  <p>© 2026 2G's BarberStudio ✂️</p>
</footer>

<script>
function openProfile(id) {
  document.getElementById('main').style.display = 'none';
  document.querySelectorAll('.profile').forEach(p => p.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function showMain() {
  document.getElementById('main').style.display = 'block';
  document.querySelectorAll('.profile').forEach(p => p.style.display = 'none');
}
</script>

</body>
</html>
